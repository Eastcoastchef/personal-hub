<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Renewals · Carl Jones Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/tools.css">
</head>
<body>
<div class="header"><div class="gut header-inner">
  <a class="brand" href="/"><div class="crest">CJ</div><div><div class="brand-name">Renewals</div><div class="brand-tag">Carl Jones Hub</div></div></a>
  <a class="back" href="/">← Back to hub</a>
</div><div class="rule"></div></div>

<main class="gut">
  <div class="stats">
    <div class="stat"><div class="k">Needs action</div><div class="v" id="action">0</div><div class="s" id="actionSub">Nothing due soon</div></div>
    <div class="stat"><div class="k">Auto-renewing</div><div class="v" id="auto">0</div><div class="s">Check the price before they roll over</div></div>
    <div class="stat"><div class="k">Yearly cost</div><div class="v" id="yearly">£0.00</div><div class="s" id="yearlySub">&nbsp;</div></div>
  </div>

  <div class="label">Insurance, MOT, tax and licences</div>
  <div class="titlebar">
    <div class="chips" id="cats" role="group" aria-label="Filter by type"></div>
    <button id="add" class="copper">+ Add renewal</button>
  </div>
  <div id="out"><div class="empty"><b>Loading…</b></div></div>
</main>

<script src="/hub.js"></script>
<script>
(function(){
  const H = Hub;
  const CATS = [["car","Car"],["home","Home"],["insurance","Insurance"],["licence","Licences and documents"],["contract","Contracts"],["subscription","Subscriptions"],["other","Other"]];
  const CATNAME = Object.fromEntries(CATS);
  let items = [], filter = "all";

  const fields = [
    {name:"name", label:"What", required:true, placeholder:"e.g. Yaris car insurance", full:true},
    {name:"date", label:"Renewal or expiry date", type:"date", required:true},
    {name:"category", label:"Type", type:"select", options:CATS, value:"insurance"},
    {name:"provider", label:"Provider", placeholder:"e.g. Admiral"},
    {name:"price", label:"Current price (£ a year)", type:"number", step:"0.01"},
    {name:"ref", label:"Policy or reference number"},
    {name:"remind", label:"Warn me (days before)", type:"number", step:"1", value:30},
    {name:"autorenew", label:"Auto-renews if I do nothing", type:"checkbox"},
    {name:"notes", label:"Notes", type:"textarea", full:true},
  ];

  function status(r){
    const n = H.days(H.parse(r.date));
    const warn = Number(r.remind) || 30;
    if (n < 0) return ["late","Expired"];
    if (n <= warn) return ["soon","Due soon"];
    return ["ok","Fine"];
  }

  function render(){
    const rows = items.filter(r=>H.parse(r.date)).sort((a,b)=>H.parse(a.date)-H.parse(b.date));
    const act = rows.filter(r=>status(r)[0]!=="ok");
    document.getElementById("action").textContent = act.length;
    document.getElementById("actionSub").textContent = act.length ? act.map(r=>r.name).slice(0,2).join(", ") + (act.length>2?" and more":"") : "Nothing due soon";
    document.getElementById("auto").textContent = rows.filter(r=>r.autorenew).length;
    const yearly = rows.reduce((s,r)=>s+(Number(r.price)||0),0);
    document.getElementById("yearly").textContent = H.money(yearly);
    document.getElementById("yearlySub").textContent = H.money(yearly/12) + " a month if spread";

    const used = [...new Set(rows.map(r=>r.category||"other"))];
    document.getElementById("cats").innerHTML = rows.length ? [["all","All"], ...CATS.filter(c=>used.includes(c[0]))].map(c =>
      '<button class="chip" data-cat="'+c[0]+'" aria-pressed="'+(filter===c[0])+'">'+H.esc(c[1])+'</button>').join("") : "";

    const out = document.getElementById("out");
    if (!items.length){
      out.innerHTML = '<div class="empty"><b>No renewals yet</b>Add car and home insurance, MOT, road tax, TV licence, passports and anything else with a date. You get a warning before each one.<br><button class="copper" data-act="add">+ Add your first renewal</button></div>';
      return;
    }
    const shown = rows.filter(r => filter==="all" || (r.category||"other")===filter);
    out.innerHTML = '<div class="list">' + shown.map(r => {
      const d = H.parse(r.date), st = status(r);
      const hist = (r.history||[]);
      const last = hist.length ? hist[hist.length-1] : null;
      let change = "";
      if (last && last.price != null && r.price != null){
        const diff = Number(r.price) - Number(last.price);
        if (Math.abs(diff) >= 0.01) change = ' · ' + (diff>0?"up ":"down ") + H.money(Math.abs(diff)) + " on last year";
      }
      const sub = [CATNAME[r.category]||"Other", r.provider, r.ref && ("ref " + r.ref)].filter(Boolean).map(H.esc).join(" · ");
      return '<div class="item">' + H.whenBadge(d) +
        '<div class="main"><b>'+H.esc(r.name)+' <span class="pill '+st[0]+'">'+st[1]+'</span>'+(r.autorenew?' <span class="pill flat">Auto-renews</span>':'')+'</b><div class="sub">'+sub+'</div></div>' +
        '<div class="amt">'+(r.price!=null?H.money(r.price):"")+'<small>'+H.long(d)+H.esc(change)+'</small></div>' +
        '<div class="actions">'+(st[0]!=="ok"?'<button class="ghost" data-renew="'+r.id+'">Renewed</button>':'')+'<button class="ghost" data-edit="'+r.id+'">Edit</button></div></div>';
    }).join("") + '</div>';
  }

  function openForm(r){
    H.form({
      title: r ? "Edit renewal" : "Add a renewal",
      fields, values: r || {},
      onSubmit: async (data) => {
        if (r){ data.history = r.history || []; const saved = await H.update("renewals", r.id, data); items = items.map(x=>x.id===r.id?saved:x); H.toast("Saved"); }
        else { data.history = []; items.push(await H.create("renewals", data)); H.toast("Renewal added"); }
        render();
      },
      onDelete: r ? async () => { await H.remove("renewals", r.id); items = items.filter(x=>x.id!==r.id); render(); H.toast("Deleted"); } : null,
    });
  }

  function openRenew(r){
    const next = H.addMonths(H.parse(r.date), 12);
    H.form({
      title: "Renewed: " + r.name,
      submitLabel: "Save renewal",
      fields: [
        {name:"date", label:"New renewal date", type:"date", required:true, value:H.iso(next)},
        {name:"price", label:"New price (£ a year)", type:"number", step:"0.01", value:r.price},
        {name:"provider", label:"Provider", value:r.provider},
        {name:"ref", label:"Policy or reference number", value:r.ref},
      ],
      onSubmit: async (data) => {
        const history = (r.history||[]).concat([{ date: r.date, price: r.price, provider: r.provider }]).slice(-10);
        const saved = await H.update("renewals", r.id, {...r, ...data, history});
        items = items.map(x=>x.id===r.id?saved:x); render(); H.toast("Renewal saved");
      },
    });
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-edit],[data-renew],[data-cat],[data-act],#add");
    if (!el) return;
    if (el.id === "add" || el.dataset.act === "add") openForm(null);
    else if (el.dataset.edit) openForm(items.find(x=>x.id===el.dataset.edit));
    else if (el.dataset.renew) openRenew(items.find(x=>x.id===el.dataset.renew));
    else if (el.dataset.cat) { filter = el.dataset.cat; render(); }
  });

  H.list("renewals").then(r => { items = r; render(); }).catch(err => {
    document.getElementById("out").innerHTML = '<div class="empty"><b>Could not load</b>'+H.esc(err.message)+'. Reload to try again.</div>';
  });
})();
</script>
</body>
</html>
