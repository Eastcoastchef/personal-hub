<style>
/* Front page: dashboard layout. Tokens come from tools.css. */
.dash{max-width:1040px;margin:0 auto;padding:max(22px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:grid;gap:18px}
@media (min-width:900px){.dash{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:26px;align-items:start}.colL,.colR{display:grid;gap:18px}}
.colL,.colR{display:grid;gap:18px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top .dow{font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--copper)}
.top .big{font-family:var(--display);font-size:44px;font-weight:700;line-height:.95;letter-spacing:-1px}
.top .sum{font-size:14px;color:var(--muted);margin-top:6px}
.top .sum b{color:var(--ink);font-weight:600}
.top .sum.late b{color:var(--red)}
.me{width:46px;height:46px;flex-shrink:0;border-radius:50%;border:2px solid var(--copper);background:var(--paper2);font-family:var(--display);font-weight:700;font-size:16px;display:grid;place-items:center;color:var(--ink);text-decoration:none}
.glass{background:var(--glass);border:1px solid var(--glassline);border-radius:22px}
.week{display:flex;gap:4px;padding:5px;border-radius:18px}
.week a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:14px;color:var(--ink);text-decoration:none;min-width:0}
.week a span{font-size:10.5px;font-weight:600;text-transform:uppercase;opacity:.6}
.week a b{font-family:var(--display);font-size:17px}
.week a i{width:5px;height:5px;border-radius:50%;background:transparent}
.week a.has i{background:var(--copper)}
.week a.late i{background:var(--red)}
.week a.today{background:var(--copper);color:#14171c}
.week a.today span{opacity:1}
.week a.today.has i{background:#14171c}
.pair{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}
.cardx{padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.k{font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.ring{position:relative;width:96px;height:96px;align-self:center;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring .n{display:flex;flex-direction:column;align-items:center;line-height:1}
.ring .n b{font-family:var(--display);font-size:32px}
.ring .n span{font-size:11px;color:var(--muted)}
.nextt{text-align:center}
.nextt b{display:block;font-size:14.5px}
.nextt span{font-size:12px;color:var(--muted)}
.plate{background:#f7d117;color:#111;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:1px;border-radius:6px;padding:5px 8px;text-align:center;white-space:nowrap}
.carrow{display:grid;gap:6px}
.carrow .st{display:flex;justify-content:space-between;gap:6px;font-size:12px}
.carrow .st span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.carrow .st b{white-space:nowrap}
.ok{color:var(--green)} .warn{color:var(--copper)} .bad{color:var(--red)}
.jobs{display:grid;gap:8px}
.job{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--ink);text-decoration:none;min-width:0}
.job.hot{background:rgba(242,169,59,.1);border-color:rgba(242,169,59,.35)}
.job.late{background:rgba(239,91,76,.1);border-color:rgba(239,91,76,.4)}
.job .ic{color:var(--copper);flex-shrink:0;display:grid}
.job.late .ic{color:var(--red)}
.job .tx{flex:1;min-width:0}
.job .tx b{display:block;font-size:14px;overflow-wrap:anywhere}
.job .tx span{font-size:12px;color:var(--muted)}
.job .btn2{font:inherit;font-size:12px;font-weight:700;border-radius:10px;padding:7px 11px;border:1px solid var(--glassline);background:transparent;color:var(--ink);cursor:pointer;flex-shrink:0;white-space:nowrap}
.job .btn2.done{background:var(--copper);border-color:var(--copper);color:#14171c}
.allclear{padding:16px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.allclear i{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(98,207,152,.15)}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 6px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);text-decoration:none;position:relative;min-width:0;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.app .sq{width:60px;height:60px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid var(--glassline);color:var(--copper);display:grid;place-items:center;transition:transform .12s}
.app:hover .sq{transform:translateY(-2px)}
.app .lb{font-size:12px;font-weight:500;color:#c9d0d8;text-align:center}
.app .bd{position:absolute;top:-4px;left:calc(50% + 18px);min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--red2);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid #151a21}
.workp{display:grid;gap:6px;padding:10px}
.workp[hidden]{display:none}
.workp a{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.workp a:hover{background:var(--glass)}
.workp a span{color:var(--copper)}
.fam{padding:14px 12px;display:grid;gap:10px}
.fam .row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.person{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;min-width:0}
.person .av{position:relative;width:58px;height:58px;display:grid;place-items:center}
.person .av svg{position:absolute;inset:0}
.person .av span{width:44px;height:44px;border-radius:50%;background:var(--paper2);font-family:var(--display);font-weight:700;font-size:17px;display:grid;place-items:center}
.person b{font-size:12.5px}
.person small{font-size:11px;color:var(--muted)}
.person.soon .av span,.person.soon small{color:var(--copper)}
.foot2{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:4px}
.foot2 a{color:inherit}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px -6px}
.sec-h a{font-size:12.5px;font-weight:600;color:var(--copper);text-decoration:none}
</style>
</head>

<script>
(function(){
  var H = window.Hub, today = H.today();
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var hr = new Date().getHours();
  var greet = hr < 12 ? "Morning" : hr < 18 ? "Afternoon" : "Evening";
  document.getElementById("dow").textContent = DAYS[today.getDay()];
  document.getElementById("big").textContent = String(today.getDate()).padStart(2,"0") + " " + MON[today.getMonth()];
  function ic(id, s){ return '<svg width="'+(s||22)+'" height="'+(s||22)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#'+id+'"/></svg>'; }
  function next(m,d){ var x = new Date(today.getFullYear(), m, d); if (x < today) x.setFullYear(x.getFullYear()+1); return x; }
  function fmt(d){ return DAYS[d.getDay()].slice(0,3) + " " + d.getDate() + " " + MON[d.getMonth()]; }

  // Family and birthday rings
  var FAM = [["Caley",1985,7,17],["Jessica",2009,10,17],["Ben",2008,2,31],["Bryony",2002,3,30]];
  var famHtml = "", fixed = [];
  FAM.forEach(function(p){
    var nb = next(p[2], p[3]), n = H.days(nb), turns = nb.getFullYear() - p[1], age = turns - (n === 0 ? 0 : 1);
    var frac = Math.max(0.03, 1 - n/365), C = 2*Math.PI*26, soon = n <= 30;
    famHtml += '<div class="person'+(soon?' soon':'')+'"><span class="av"><svg width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="26" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/><circle cx="29" cy="29" r="26" fill="none" stroke="'+(soon?'var(--copper)':'#7d8a99')+'" stroke-width="3" stroke-linecap="round" stroke-dasharray="'+(C*frac).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 29 29)"/></svg><span>'+p[0][0]+'</span></span><b>'+p[0]+'</b><small>'+(n===0?'Birthday today':soon?turns+' in '+n+(n===1?' day':' days'):age+' · '+MON[nb.getMonth()])+'</small></div>';
    fixed.push({t: p[0] + " turns " + turns, s: "Birthday", d: nb, icon: "i-gift", href: "/calendar.html"});
  });
  document.getElementById("fam").innerHTML = famHtml;
  fixed.push({t: "ICB hold ends", s: "Sterling policy", d: new Date(2026,11,16), icon: "i-file", href: "/disputes.html", tool: "cases"});
  fixed.push({t: "Christmas Day", s: "", d: next(11,25), icon: "i-gift", href: "/calendar.html"});

  // Work hubs panel
  var wb = document.getElementById("workBtn"), wp = document.getElementById("workp");
  wb.addEventListener("click", function(){ wp.hidden = !wp.hidden; wb.setAttribute("aria-expanded", String(!wp.hidden)); if (!wp.hidden) wp.scrollIntoView({behavior:"smooth", block:"nearest"}); });

  var items = fixed.slice(), D = {}, carsList = [];
  function every(t){ var l = H.parse(t.last); return l ? H.addDays(l, Number(t.every) || 30) : null; }

  function render(){
    var future = items.filter(function(i){ return i.d && (H.days(i.d) >= 0 || i.late); }).sort(function(a,b){ return a.d - b.d; });
    // Next up: soonest dated item that is not a bill (no money on the front page)
    var nx = future.filter(function(i){ return H.days(i.d) >= 0; })[0];
    if (nx){
      var n = H.days(nx.d);
      document.getElementById("nextN").textContent = n === 0 ? "Today" : n;
      document.getElementById("nextN").style.fontSize = n === 0 ? "22px" : "";
      document.getElementById("nextU").textContent = n === 0 ? "" : (n === 1 ? "day" : "days");
      document.getElementById("nextT").textContent = nx.t;
      document.getElementById("nextD").textContent = fmt(nx.d);
      var frac = Math.max(0.04, 1 - n/30); if (n > 30) frac = 0.04;
      document.getElementById("nextArc").setAttribute("stroke-dasharray", (264*frac).toFixed(1) + " 264");
      document.getElementById("next").href = nx.href || "/calendar.html";
    }
    // Week strip
    var wk = "";
    for (var i = 0; i < 7; i++){
      var d = H.addDays(today, i);
      var on = items.filter(function(x){ return x.d && H.iso(x.d) === H.iso(d); });
      var late = i === 0 && items.some(function(x){ return x.d && H.days(x.d) < 0; });
      wk += '<a href="/calendar.html" class="'+(i===0?'today ':'')+(on.length?'has ':'')+(late?'late':'')+'" aria-label="'+fmt(d)+(on.length?', '+on.length+' thing'+(on.length>1?'s':''):'')+'"><span>'+DAYS[d.getDay()].slice(0,3)+'</span><b>'+d.getDate()+'</b><i></i></a>';
    }
    document.getElementById("week").innerHTML = wk;
    // This week list: overdue plus next 7 days
    var wkItems = items.filter(function(x){ return x.d && H.days(x.d) <= 7 && (H.days(x.d) >= 0 || x.late); }).sort(function(a,b){ return a.d - b.d; });
    var lateN = wkItems.filter(function(x){ return H.days(x.d) < 0; }).length;
    var sum = document.getElementById("sum");
    sum.className = "sum" + (lateN ? " late" : "");
    sum.innerHTML = greet + ", Carl. " + (lateN ? "<b>" + lateN + " overdue.</b>" : wkItems.length ? "<b>" + wkItems.length + (wkItems.length === 1 ? " thing" : " things") + "</b> this week." : "Nothing due this week.");
    var jobs = document.getElementById("jobs");
    if (!wkItems.length) jobs.innerHTML = '<div class="allclear glass"><i></i>All clear for the next 7 days.</div>';
    else jobs.innerHTML = wkItems.map(function(x, idx){
      var n = H.days(x.d), cls = n < 0 ? " late" : n <= 3 ? " hot" : "";
      var when = n < 0 ? Math.abs(n) + (n === -1 ? " day" : " days") + " late" : n === 0 ? "Today" : n === 1 ? "Tomorrow" : fmt(x.d);
      var btn = x.done ? '<button type="button" class="btn2 done" data-done="'+idx+'">Done</button>' : '<span class="btn2" aria-hidden="true">Open</span>';
      return '<a class="job glass'+cls+'" href="'+(x.href||"#")+'"><span class="ic">'+ic(x.icon||"i-cal")+'</span><span class="tx"><b>'+H.esc(x.t)+'</b><span>'+H.esc(when + (x.s ? " · " + x.s : ""))+'</span></span>'+btn+'</a>';
    }).join("");
    jobs._items = wkItems;
    // Badges on tool icons: overdue or due within 7 days
    var counts = {};
    wkItems.forEach(function(x){ if (x.tool) counts[x.tool] = (counts[x.tool]||0) + 1; });
    document.querySelectorAll(".app[data-b]").forEach(function(a){
      var c = counts[a.getAttribute("data-b")], b = a.querySelector(".bd");
      if (c){ if (!b){ b = document.createElement("span"); b.className = "bd"; a.appendChild(b); } b.textContent = c; }
      else if (b) b.remove();
    });
    // Cars card
    var cb = document.getElementById("carsBox");
    if (!carsList.length) cb.innerHTML = '<span style="font-size:13px;color:var(--muted)">Add your cars</span>';
    else cb.innerHTML = carsList.slice(0,2).map(function(c){
      var soon = null;
      [["mot","MOT"],["tax","Tax"],["insurance","Insurance"],["service","Service"]].forEach(function(k){ var d = H.parse(c[k[0]]); if (d && (!soon || d < soon.d)) soon = {d:d, l:k[1]}; });
      var name = (c.model || "").split(" ").slice(1,2).join(" ") || c.model || "Car";
      var st;
      if (!soon) st = '<span>'+H.esc(name)+'</span><b class="warn">Add dates</b>';
      else { var n = H.days(soon.d); st = '<span>'+H.esc(name+" "+soon.l)+'</span><b class="'+(n<0?'bad':n<=30?'warn':'ok')+'">'+(n<0?Math.abs(n)+'d late':n===0?'Today':n<=60?n+' days':'All clear')+'</b>'; }
      return '<div class="carrow"><span class="plate">'+H.esc((c.reg||"").toUpperCase())+'</span><span class="st">'+st+'</span></div>';
    }).join("");
    // Title and app badge for urgent things (overdue or within 3 days)
    var urgent = wkItems.filter(function(x){ return x.href && H.days(x.d) <= 3; }).length;
    document.title = (urgent ? "(" + urgent + ") " : "") + "Carl Jones Hub";
    try { if (navigator.setAppBadge){ urgent ? navigator.setAppBadge(urgent) : navigator.clearAppBadge(); } } catch(e){}
  }

  // Done buttons: repeating care and maintenance jobs
  document.getElementById("jobs").addEventListener("click", function(e){
    var b = e.target.closest("[data-done]"); if (!b) return;
    e.preventDefault();
    var x = document.getElementById("jobs")._items[Number(b.getAttribute("data-done"))];
    if (!x || !x.done) return;
    b.disabled = true;
    var rec = Object.assign({}, x.done.rec, {last: H.iso(today)});
    delete rec.id; delete rec.updated_at;
    H.update(x.done.col, x.done.rec.id, rec).then(function(){
      H.toast("Marked done"); items = items.filter(function(i){ return i !== x; }); render();
    }).catch(function(err){ H.toast(err.message, true); b.disabled = false; });
  });

  render();
  var cols = ["borrowing","cars","bills","renewals","dog_tasks","dog_profile","home_tasks","home_suppliers","health_appts","health_meds","travel_trips","travel_docs","cal_events","cases"];
  Promise.all(cols.map(function(c){ return H.list(c).catch(function(){ return []; }); })).then(function(res){
    cols.forEach(function(c,i){ D[c] = res[i]; });
    var add = function(o){ if (o.d) { o.late = H.days(o.d) < 0; items.push(o); } };
    carsList = D.cars;
    D.cars.forEach(function(c){ [["mot","MOT"],["tax","tax"],["insurance","insurance"],["service","service"]].forEach(function(k){ var d = H.parse(c[k[0]]); if (d && H.days(d) <= 30) add({t:(c.reg||"").toUpperCase()+" "+k[1], s:c.model||"", d:d, icon:"i-car", href:"/cars.html", tool:"cars"}); }); });
    D.bills.forEach(function(b){ var d = H.nextDue(b.due, b.freq); if (d && H.days(d) <= 7) add({t:b.name, s:((b.who||"carl")==="caley"?"Caley's bill":"Bill"), d:d, icon:"i-pound", href:"/bills.html", tool:"bills"}); });
    D.renewals.forEach(function(r){ var d = H.parse(r.date); if (!d) return; var n = H.days(d); if (n <= (Number(r.remind)||30)) add({t:r.name, s:r.autorenew?"auto-renews, check price":"renewal", d:d, icon:"i-shield", href:"/renewals.html", tool:"renewals"}); });
    var dogName = (D.dog_profile[0] && D.dog_profile[0].name) || "Maggie";
    document.getElementById("dogName").textContent = dogName;
    D.dog_tasks.forEach(function(t){ var d = every(t); if (d && H.days(d) <= 7) add({t:dogName+": "+t.name, s:"", d:d, icon:"i-paw", href:"/dog.html", tool:"dog", done:{col:"dog_tasks", rec:t}}); });
    D.home_tasks.forEach(function(t){ var d = every(t); if (d && H.days(d) <= 14) add({t:t.name, s:"home", d:d, icon:"i-home", href:"/home.html", tool:"home", done:{col:"home_tasks", rec:t}}); });
    D.home_suppliers.forEach(function(x){ var d = H.parse(x.contractEnd); if (d && H.days(d) <= 45) add({t:x.name+" contract ends", s:"compare before it rolls over", d:d, icon:"i-home", href:"/home.html", tool:"home"}); });
    D.health_appts.forEach(function(a){ var d = H.parse(a.date); if (d && H.days(d) >= 0 && H.days(d) <= 30) add({t:a.what, s:((H.PERSON&&H.PERSON[a.who])||a.who||"")+(a.time?" at "+a.time:""), d:d, icon:"i-heart", href:"/health.html", tool:"health"}); });
    D.health_meds.forEach(function(m){ var d = every(m); if (d && H.days(d) <= 7) add({t:"Reorder "+m.name, s:"prescription", d:d, icon:"i-heart", href:"/health.html", tool:"health", done:{col:"health_meds", rec:m}}); });
    D.travel_trips.forEach(function(t){ var d = H.parse(t.start); if (d && H.days(d) >= 0 && H.days(d) <= 60) add({t:t.name, s:"trip", d:d, icon:"i-plane", href:"/travel.html", tool:"travel"}); });
    D.travel_docs.forEach(function(x){ var d = H.parse(x.expiry); if (d && H.days(d) <= (Number(x.remind)||180)) add({t:"Renew "+(x.type==="passport"?"passport":x.type||"document"), s:(H.PERSON&&H.PERSON[x.who])||x.who||"", d:d, icon:"i-plane", href:"/travel.html", tool:"travel"}); });
    D.cal_events.forEach(function(e){ var d = H.parse(e.date); if (!d) return; if (e.yearly){ d = new Date(today.getFullYear(), d.getMonth(), d.getDate()); if (d < today) d.setFullYear(d.getFullYear()+1); } if (H.days(d) >= 0 && H.days(d) <= 60) add({t:e.title, s:e.time?"at "+e.time:"diary", d:d, icon:"i-cal", href:"/calendar.html"}); });
    D.borrowing.forEach(function(b){ var d = H.parse(b.dealEnd); if (d && H.days(d) <= 90) add({t:b.name+" deal ends", s:"look at what it moves to", d:d, icon:"i-bank", href:"/borrowing.html", tool:"borrowing"}); });
    D.cases.forEach(function(c){ if (["settled","closed"].indexOf(c.status) > -1) return; var d = H.parse(c.deadline); if (d && H.days(d) <= 30 && !/ICB hold/i.test(c.deadlineWhat||"")) add({t:c.title, s:c.deadlineWhat||"deadline", d:d, icon:"i-file", href:"/disputes.html", tool:"cases"}); });
    // Late items from fixed/past dates should not linger: only tool items can be late
    items = items.filter(function(i){ return H.days(i.d) >= 0 || i.href !== "/calendar.html"; });
    render();
  }).catch(function(){});
})();
</script>
</body>
</html>
