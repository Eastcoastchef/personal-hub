<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Disputes and Claims · Carl Jones Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/tools.css">
</head>
<body>
<div class="header"><div class="gut header-inner">
  <a class="brand" href="/"><div class="crest">CJ</div><div><div class="brand-name">Disputes and Claims</div><div class="brand-tag">Carl Jones Hub</div></div></a>
  <a class="back" href="/">← Back to hub</a>
</div><div class="rule"></div></div>
<main class="gut" id="app"></main>
<script src="/hub.js"></script>
<script src="/tool-engine.js"></script>
<script>
(function(){
const H = Hub;
const STATUS=[["open","Open"],["waiting","Waiting on them"],["deciding","Deciding"],["escalated","Escalated (ombudsman)"],["settled","Settled"],["closed","Closed"]];
const ST=Object.fromEntries(STATUS);
const caseOpts=d=>d.cases.map(c=>[c.id,c.title]);
H.tool({
  stats: d => {
    const open=d.cases.filter(c=>!["settled","closed"].includes(c.status));
    const next=open.map(c=>({c,d:H.parse(c.deadline)})).filter(x=>x.d).sort((a,b)=>a.d-b.d)[0];
    const owed=open.reduce((s,c)=>s+(Number(c.amount)||0),0);
    return [
      {k:"Open cases", v:String(open.length), s:open.map(c=>c.title).slice(0,2).join(", ")||"None"},
      {k:"Next deadline", v:next?H.short(next.d):"–", s:next?next.c.title:"No deadlines set"},
      {k:"Amount in dispute", v:H.money(owed), s:"Across open cases"},
    ];
  },
  sections: [
    { col:"cases", title:"Cases", intro:"Complaints, claims and disputes, with the refs and deadlines that matter.", addLabel:"Add case", noun:"case",
      emptyTitle:"No cases", emptyText:"Add a complaint, insurance claim or dispute.",
      defaults:()=>({status:"open"}),
      fields:[{name:"title",label:"Case",required:true,full:true},{name:"against",label:"Against"},{name:"status",label:"Status",type:"select",options:STATUS},{name:"amount",label:"Amount (£)",type:"number",step:"0.01"},{name:"deadline",label:"Next deadline",type:"date"},{name:"deadlineWhat",label:"What the deadline is",full:true},{name:"refs",label:"References",full:true},{name:"contacts",label:"Contacts (names, phone, email)",type:"textarea",full:true},{name:"notes",label:"Where it stands",type:"textarea",full:true}],
      sort:(a,b)=>{ const ca=["settled","closed"].includes(a.status), cb=["settled","closed"].includes(b.status); if(ca!==cb) return ca?1:-1; return (H.parse(a.deadline)||new Date(9e15))-(H.parse(b.deadline)||new Date(9e15)); },
      row:(c,d)=>{ const dl=H.parse(c.deadline); const done=["settled","closed"].includes(c.status); const n=d.case_log.filter(l=>l.case===c.id).length;
        return {date:done?undefined:dl, dayBadge:done?["✓",ST[c.status]]:undefined, title:c.title, pill:'<span class="pill '+(done?"flat":c.status==="deciding"||c.status==="waiting"?"soon":"late")+'">'+H.esc(ST[c.status]||"Open")+'</span>', right:c.amount!=null&&c.amount!==""?H.money(c.amount):"", rightSub:dl&&!done?H.long(dl):"",
          sub:[c.against,c.refs,dl&&!done&&c.deadlineWhat,n+(n===1?" timeline entry":" timeline entries")].filter(Boolean).join(" · "), subHtml:c.notes?'<div class="note">'+H.esc(c.notes)+'</div>':""}; } },
    { col:"case_log", title:"Timeline", intro:"Every call, letter and email, with the date. This is what you'd show an ombudsman.", addLabel:"Add entry", noun:"timeline entry",
      emptyTitle:"No timeline entries", emptyText:"Log each contact as it happens.",
      defaults:(d)=>({date:H.iso(H.today()), case:(d.cases[0]||{}).id, kind:"call"}),
      fields:[{name:"case",label:"Case",type:"select",options:caseOpts,full:true},{name:"date",label:"Date",type:"date",required:true},{name:"kind",label:"Type",type:"select",options:[["call","Phone call"],["email","Email"],["letter","Letter"],["text","Text"],["payment","Payment"],["note","Note"]]},{name:"what",label:"What happened",type:"textarea",required:true,full:true}],
      sort:(a,b)=>(H.parse(b.date)||0)-(H.parse(a.date)||0),
      row:(l,d)=>{ const dt=H.parse(l.date); const c=d.cases.find(x=>x.id===l.case); const K={call:"Call",email:"Email",letter:"Letter",text:"Text",payment:"Payment",note:"Note"};
        return {dayBadge:[dt?dt.getDate():"?", dt?H.short(dt).split(" ")[1]+" "+String(dt.getFullYear()).slice(2):""], title:(K[l.kind]||"Note")+(c?" · "+c.title:""), subHtml:'<div class="note">'+H.esc(l.what||"")+'</div>'}; } },
  ],
});

})();
</script>
</body>
</html>
