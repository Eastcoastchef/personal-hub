name = "personal-hub"
main = "worker.js"
compatibility_date = "2026-10-01"

# Every request goes through worker.js first (login check) before any file in public/ is served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Limits login attempts to 5 a minute per IP address.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
