name = "personal-hub"
main = "worker.js"
compatibility_date = "2026-10-01"

# Every request goes through worker.js first (login check) before any file in public/ is served.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Limits login attempts to 5 a minute per IP address.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Personal data for the bills, renewals and dog tools. Only the worker can reach it.
[[d1_databases]]
binding = "DB"
database_name = "personal-hub"
database_id = "d9de61e6-d57d-464c-9ebc-9922c8d6c07d"

# Nightly copy of all data, kept 30 days (see runBackup in worker.js).
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "personal-hub-backups"

[triggers]
crons = ["30 2 * * *"]
